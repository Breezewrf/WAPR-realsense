name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test helpers
        run: python -m pip install numpy scipy trimesh pillow opencv-python-headless pyyaml packaging onnx
      - name: Install CPU Torch for detector alignment and replay tests
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test configuration, geometry and output contracts
        run: python -B -m unittest discover -s tests -v
