name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test helpers
        run: python -m pip install numpy scipy trimesh pillow opencv-python-headless
      - name: Test configuration, geometry and output contracts
        run: python -B -m unittest discover -s tests -v
      - name: Verify clean source export
        run: python scripts/export_source.py /tmp/WAPR-realsense-check
