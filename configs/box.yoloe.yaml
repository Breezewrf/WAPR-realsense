mesh: ../assets/meshes/box_hy_scaled/model.obj
mesh_unit: m
mesh_scale: 1.0
backend: trt
tracking_recovery:
  activate: true
  timeout_s: 5.0
  confirm_frames: 2
kalman_motion_prediction:
  activate: true
  translation_measurement_std_m: 0.01
  rotation_measurement_std_rad: 0.05
  translation_acceleration_std_m_s2: 1.0
  rotation_acceleration_std_rad_s2: 3.0
  max_dt_s: 0.5
groundingdino_sam2_dinov2_detect:
  activate: true
  use_sam2: false
width: 640
height: 480
fps: 30
min_score: 0.5
camera_frame: color_optical_frame
object_frame: box_hy
print_every: 10
output: ../outputs/box_yoloe
yoloe_detection:
  activate: true
  model: ../.wapr_runtime/yoloe/yoloe-26s-seg.pt
  prompt_embeddings: ../assets/references/box/prompt_embeddings.npz
  conf: 0.05
  imgsz: 640
  device: '0'
  max_candidates: 3
