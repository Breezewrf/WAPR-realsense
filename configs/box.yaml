mesh: ../assets/meshes/box/textured_mesh_modified.obj
mesh_unit: m
mesh_scale: 1.0
backend: trt

tracking_recovery:
  activate: true
  timeout_s: 1.0
  confirm_frames: 2

kalman_motion_prediction:
  activate: true
  translation_measurement_std_m: 0.01
  rotation_measurement_std_rad: 0.05
  translation_acceleration_std_m_s2: 1.0
  rotation_acceleration_std_rad_s2: 3.0
  max_dt_s: 0.5

groundingdino_sam2_dinov2_detect:
  activate: false  # false: manual ROI; true: automatic initialization/recovery
  use_sam2: true   # false: use bbox input

width: 640
height: 480
fps: 15
min_score: 0.5
camera_frame: color_optical_frame
object_frame: box
print_every: 10
output: ../outputs/box
